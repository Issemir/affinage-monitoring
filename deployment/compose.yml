
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../secrets/mosquitto_passwordfile:/mosquitto/config/passwordfile:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - monitoring

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?Set INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?Set INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-affinage}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-fridge}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: 2160h
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 12

  telegraf:
    image: telegraf:1
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-telegraf}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-affinage}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-fridge}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-affinage}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-fridge}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - monitoring


networks:
  monitoring:
    driver: bridge

volumes:
  mosquitto_data:
  influxdb_data:
  grafana_data:
